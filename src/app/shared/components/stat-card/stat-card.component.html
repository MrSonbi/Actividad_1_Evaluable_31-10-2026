<article class="stat-card">
  @if (icon()) {
    <ion-icon class="stat-card__icon" [attr.name]="icon()" aria-hidden="true"></ion-icon>
  }
  <div class="stat-card__body">
    <p class="stat-card__title">{{ title() }}</p>
    <p class="stat-card__value">{{ value() }}</p>
    @if (trend(); as trend) {
      <p [class]="'stat-card__trend stat-card__trend--' + trend.direction">
        <span aria-hidden="true">{{ trendSymbol(trend.direction) }}</span>
        {{ trend.label }}
      </p>
    }
    @if (hint()) {
      <p class="stat-card__hint">{{ hint() }}</p>
    }
  </div>
</article>
