@if (authStore.isAuthenticated()) {
  <a class="skip-link" href="#main-content">Saltar al contenido</a>
  <ion-split-pane contentId="main-content" when="lg">
    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar>
          <ion-title>Inventario</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list>
          @if (authStore.isAdmin()) {
            <ion-menu-toggle auto-hide="false">
              <ion-item routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                <ion-icon slot="start" name="home-outline"></ion-icon>
                <ion-label>Dashboard</ion-label>
              </ion-item>
            </ion-menu-toggle>
            <ion-menu-toggle auto-hide="false">
              <ion-item routerLink="/components-demo" routerLinkActive="active">
                <ion-icon slot="start" name="grid-outline"></ion-icon>
                <ion-label>Componentes (demo)</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/products" routerLinkActive="active">
              <ion-icon slot="start" name="cube-outline"></ion-icon>
              <ion-label>Productos</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
        <div class="user-info">
          <div class="user-name">{{ authStore.profile()?.full_name || authStore.email() }}</div>
          <div class="user-role">{{ authStore.role() }}</div>
          <ion-button fill="clear" size="small" (click)="signOut()">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            Cerrar sesión
          </ion-button>
        </div>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
}
